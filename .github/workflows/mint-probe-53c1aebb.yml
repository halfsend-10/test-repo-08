# Behaviour-test mint probe shim (pkg/behaviourtest/steps/mint_probe.go).
# Pushed to a temporary branch of the leased test repository; scenario
# cleanup deletes the branch.
name: mint-probe-53c1aebb

on:
  push:
    branches: ['behaviour/mint-probe-53c1aebb']

permissions: {}

jobs:
  # Same-repository request through the approved host: must mint.
  control:
    permissions:
      contents: read
      id-token: write
    uses: halfsend-10/test-repo-08-mint-host/.github/workflows/mint-probe.yml@main
    with:
      mint_url: ${{ vars.FULLSEND_MINT_URL }}
      role: 'fullsend'
      level: 'write'
      repos_json: '["test-repo-08"]'
      artifact_name: 'mint-probe-control'

  # The request under test.
  subject:
    permissions:
      contents: read
      id-token: write
    uses: halfsend-10/test-repo-08-mint-host/.github/workflows/mint-probe.yml@main
    with:
      mint_url: ${{ vars.FULLSEND_MINT_URL }}
      role: 'fullsend'
      level: 'write'
      repos_json: '["test-repo-08"]'
      artifact_name: 'mint-probe-subject'
